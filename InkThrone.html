<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkThrone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#121014;--bg2:#1B181F;--text:#EDE6D8;--muted:#A39BA6;--line:rgba(237,230,216,.14);--accent:#B3123A;--accent2:#D9A441;--glow:#4B1D3F;
--display:"IM Fell English",Georgia,serif;--body:Spectral,Georgia,serif;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F4ECDD;--bg2:#FFF9EC;--text:#2B1F1B;--muted:#6E5F57;--line:rgba(43,31,27,.16)}}
:root[data-theme="light"]{--bg:#F4ECDD;--bg2:#FFF9EC;--text:#2B1F1B;--muted:#6E5F57;--line:rgba(43,31,27,.16)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:1.0625rem;line-height:1.7;overflow-x:hidden;transition:background .5s,color .5s}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(30px);animation:drift 26s ease-in-out infinite alternate;
background:radial-gradient(40% 35% at 20% 25%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%),radial-gradient(35% 30% at 80% 70%,color-mix(in srgb,var(--glow) 65%,transparent),transparent 70%)}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:60rem;margin:0 auto;padding:0 1.25rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;font-family:var(--ui);font-size:.9rem}
.logo{font-family:var(--display);font-size:1.55rem}.logo b{color:var(--accent2);font-weight:400}
.pill{background:none;border:1px solid var(--line);color:var(--text);border-radius:2rem;padding:.5rem 1rem;min-height:44px;font-family:var(--ui);font-size:.85rem}
.backs{display:flex;gap:.6rem;flex-wrap:wrap;padding:.4rem 0}
.back{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.5rem 1.1rem .5rem .8rem;border-radius:2rem;border:1px solid color-mix(in srgb,var(--accent2) 45%,transparent);background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(8px);color:var(--text);font-family:var(--ui);font-size:.9rem;transition:border-color .25s,box-shadow .25s}
.back svg{width:1.1rem;height:1.1rem;fill:none;stroke:var(--accent2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.back:hover{border-color:var(--accent2);box-shadow:0 0 18px -4px var(--accent2)}
.back:hover svg{transform:translateX(-4px)}
.cover.has{background-size:cover;background-position:center}.cover.has svg{display:none}.cover.has::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(8,6,10,.92))}.cover.has strong,.cover.has em{position:relative;z-index:1}
.hero{padding:clamp(2.5rem,10vh,6rem) 0 2rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,12vw,6.5rem);line-height:.98;margin:0 0 1.2rem}
.hero h1 span{display:block;opacity:0;filter:blur(10px);transform:translateY(.3em);animation:ign 1.5s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 span+span{animation-delay:.3s;font-style:italic;color:var(--accent2);text-shadow:0 0 .6em color-mix(in srgb,var(--accent) 70%,transparent)}
@keyframes ign{to{opacity:1;transform:none;filter:none}}
.lead{color:var(--muted);font-size:1.15rem;max-width:32rem;margin:0 0 1.6rem}
.btn{display:inline-flex;align-items:center;min-height:48px;background:var(--accent);color:#fff;border:0;border-radius:.25rem;padding:.7rem 1.6rem;font-family:var(--ui);font-weight:600;transition:filter .2s}
.btn:hover{filter:brightness(1.15)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);margin:2.5rem 0 .4rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1.5rem;padding:1.2rem 0 2rem;perspective:900px}
.cover{position:relative;aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;overflow:hidden;border-radius:.2rem .5rem .5rem .2rem;
background:linear-gradient(160deg,color-mix(in srgb,var(--a) 85%,#000),#0b090d 85%);border:1px solid color-mix(in srgb,var(--b) 40%,transparent);
box-shadow:inset 6px 0 8px rgba(0,0,0,.45),0 18px 30px -14px color-mix(in srgb,var(--a) 70%,#000);transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .25s ease-out}
.cover svg{position:absolute;top:14%;left:50%;width:60%;transform:translateX(-50%);fill:none;stroke:var(--b);stroke-width:2.2;filter:drop-shadow(0 0 8px var(--b))}
.cover strong{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.1;color:#F4ECDD}
.cover em{font-size:.8rem;color:var(--b)}
.card.soon .cover{opacity:.7;border-style:dashed}
.card small{display:block;margin-top:.5rem;font-family:var(--ui);font-size:.82rem;color:var(--muted)}
.bookhead{display:grid;grid-template-columns:9rem 1fr;gap:1.4rem;align-items:end;padding:1.5rem 0}
@media(min-width:600px){.bookhead{grid-template-columns:12rem 1fr}}
.bookhead h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;margin:0 0 .5rem}
.bookhead p{margin:0 0 1rem;color:var(--muted)}
.chapters{list-style:none;margin:1rem 0 3rem;padding:0;border-top:1px solid var(--line)}
.chapters a{display:flex;justify-content:space-between;gap:1rem;min-height:48px;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--line)}
.chapters a:hover{color:var(--accent2)}.chapters span{font-family:var(--ui);font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.8rem 0;font-family:var(--ui);font-size:.85rem}
.reader{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:clamp(1.3rem,5vw,3rem);margin-bottom:1.5rem}
.reader h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 1.2rem}
.reader p{max-width:36rem;margin:0 0 1.1rem;font-size:var(--fs,1.125rem)}
.reader p:first-of-type::first-letter{float:left;font-family:var(--display);font-size:4rem;line-height:.8;padding:.3rem .55rem 0 0;color:var(--accent2)}
.nav{display:flex;justify-content:space-between;gap:.8rem;margin-bottom:3rem}
.nav .btn{background:var(--bg2);color:var(--text);border:1px solid var(--line)}.nav .btn.go{background:var(--accent);color:#fff;border-color:transparent}
.sb{text-align:center;color:var(--accent2);letter-spacing:.6em;margin:1.6rem 0!important}
.ad{margin:1.5rem 0;min-height:90px;border:1px dashed var(--line);border-radius:.3rem;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--ui);font-size:.75rem}
.page{max-width:36rem;padding:1rem 0 3rem}.page h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3rem);margin:.5rem 0 1rem}.page p{margin:0 0 1.1rem}
.flinks{display:flex;gap:1.4rem;margin-bottom:.6rem}.flinks a{min-height:44px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 0}.chip{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:2rem;padding:.5rem 1rem;min-height:44px;font-family:var(--ui);font-size:.85rem;transition:border-color .25s}.chip[aria-pressed="true"]{border-color:var(--accent2);box-shadow:0 0 14px -6px var(--accent2)}.gen{color:var(--accent2);font-family:var(--ui);font-size:.85rem;margin:0 0 .6rem}
.plan li{padding:.8rem .2rem;border-bottom:1px solid var(--line)}.pl span{font-family:var(--ui);font-size:.75rem;color:var(--muted)}.pl b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem}.pl em{color:var(--muted);font-size:.95rem}
.empty{color:var(--muted);padding:2rem 0}
footer{padding:2rem 0 3rem;color:var(--muted);font-family:var(--ui);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 span{opacity:1;transform:none;filter:none}}
</style>
</head>

 desc:"Kael Thornheart, an Ashenborn outcast with dragon-king blood, and Seraphine Voss, the last Witch Keeper, hunt the shards that can wake or bind the dragon-god Vrennoch. Slow-burn romance, dark magic, and a crown that burns.",
 chapters:[{"t": "Ash and Ember", "x": "The day Kael Thornheart turned seventeen, the village threw a bonfire — not to celebrate him, but to burn his mother's remaining belongings.\n\nHe watched from the edge of the wheat field, bare feet in the cold dirt, smoke curling into the bruise-coloured dusk. They cheered when her embroidered shawl caught flame, the one she had worn every winter since before he was born. The one she had wrapped around him the night she vanished, pressing her lips to his brow as though kissing him goodbye for eternity rather than eight hours.\n\nShe never came back. Neither had her warmth.\n\nKael did not cry. He had learned long ago that tears were currency wasted on people who would never pay him back. Instead, he stood with his jaw clenched and his dark eyes tracking every face in the crowd, memorizing which of them smiled widest. He was good at remembering. Perhaps it was his only gift.\n\nThe Kingdom of Valdremor had a name for boys like him: ‘Ashenborn.’ Children who bore no magical sigil on their skin at the Awakening Ceremony — no golden rune blooming at the base of their neck, no elemental glyph igniting on their palm. Just plain flesh. A failure of blood. A stain on the family name.\n\nHis father, Lord Edric Thornheart, had made sure everyone in their province knew his son was stained.\n\n‘He has nothing,’ Edric had said at the ceremony three years ago, loud enough for the whole square to hear. ‘No fire, no frost, no stone, no wind. Not even the lowliest healing thread. He is nothing. And nothings do not carry the Thornheart name.’\n\nKael had stood on that dais while the crowd murmured, while girls his age covered their mouths in secondhand embarrassment, while boys he had once called friends stepped deliberately away from him as though absence of magic was contagious. His father had turned his back. His two older brothers had laughed.\n\nThat had been the last day he slept under the Thornheart roof.\n\nNow he slept in the barn of a miller named Hadwick, who paid him in stale bread and silence. It was more dignity than most Ashenborn received. He didn’t complain.\n\nWhat he did instead — what he had been doing for three years while the village forgot he existed — was train.\n\nNot in magic. He had none. Or so everyone believed.\n\nHe trained in the one thing no Valdremoran bothered to master because they didn’t need to: his body. Dawn runs through the Black Pines. Stone lifts behind the granary. The old soldier’s manual he’d stolen from the garrison library and read until the pages fell apart. Balance. Speed. Pain tolerance. How to fall without breaking. How to take a blow and give nothing away.\n\nHe had also begun doing something stranger, something he told no one about. At night, when the miller’s household slept, Kael would slip out to the edge of the forest and press his palms flat against the old standing stones that predated the kingdom itself. And he would breathe. Slow and deep, like the old texts described meditation — the kind magic users did to commune with their sigils.\n\nHe had no sigil. But something breathed back.\n\nNot fire. Not frost. Something older. Something that tasted like smoke and midnight, that moved behind his ribs like a second heartbeat barely out of sync with his own. He had never told a soul. In Valdremor, unexplained power was investigated by the Crown’s Inquisitors — and investigations never ended well for Ashenborn.\n\n§\n\nThree years of silence. Of becoming someone they didn’t recognize.\n\nThe bonfire was dying now. The crowd dispersing into cottages and warmth, back to suppers and safe magic and ordinary cruelties. Kael turned to leave.\n\nSomeone caught his arm.\n\nHe spun, reflexes sharp enough that his hand was at the throat of whoever had grabbed him before his eyes caught up with his instincts. He stopped himself — barely.\n\nA girl. No. A young woman, dark-eyed and unafraid, which was the first unusual thing about her. Most people flinched from him these days; his silence had a reputation that preceded him like a blade. She did not flinch. She stared at his hand at her throat with the cool appraisal of someone cataloguing a threat, not experiencing one.\n\n‘You have quick hands for a nobody,’ she said. Her voice was low, smoke- rough, like she had been shouting for years and had only just learned to whisper.\n\nHe released her. Stepped back. Studied her.\n\nShe was not from the village. Her clothes were wrong — dark travelling leathers with silver stitching at the cuffs, the kind of garment that cost more than Hadwick’s entire barn. Her hair was black and cut bluntly at her jaw. Her eyes, he realized, were not merely dark — they were a deep, shifting amber, the colour of embers just before they died. And on the inside of her left wrist, half- hidden beneath her sleeve, was the edge of a sigil he had never seen before. Not the standard crown-approved glyphs. Something old. Something wild.\n\n‘Who are you?’ he asked.\n\nShe smiled. It was not a kind smile. It was the smile of someone who already knew the answer to every question she was about to ask.\n\n‘My name is Seraphine Voss,’ she said. ‘And I’ve been watching you press your hands against those old stones for six months, Kael Thornheart. It’s time we had a conversation about what answers back.’"},
{"t": "The Girl with Ember Eyes", "x": "He didn’t follow her immediately. That was the first thing she seemed to respect about him.\n\nMost people, she told him later, followed her immediately. She had that effect. Seraphine Voss was the kind of person rooms organized themselves around without knowing why — a gravitational pull beneath the surface of ordinary conversation. But Kael had stood there in the cold with his arms folded and his jaw set, studying her the way he studied everything: like a puzzle that might be a trap.\n\n‘I don’t know you,’ he said. ‘And you clearly know things about me that I haven’t offered. That’s not a conversation. That’s an ambush.\n\n‘Fair,’ she said, apparently genuinely unbothered. ‘So ask me something.\n\nHe looked at the sigil peeking from her sleeve. ‘What is that mark?\n\nHer expression shifted — not into discomfort, but into something more careful. Deliberate. She pulled her sleeve down with the ease of someone who had made that gesture ten thousand times. ‘A question for another night. Ask something simpler.\n\n‘What do you want from me?’\n\nShe met his eyes. The ember-glow in hers seemed to deepen, though no fire was near them any longer. ‘The same thing everyone who has ever stumbled onto real power wants from the person who has it: to see what you’ll do with it before it destroys you.\n\nHe followed her.\n\nNot because she was beautiful — though she was, in the way that unlit storms are beautiful, in the way that a blade laid flat on silk is beautiful. He followed her because she was the first person in three years who had spoken to him like he was a problem worth solving rather than one better discarded.\n\nShe led him out of the village entirely, through the Black Pines on a path he had never found in his own three years of running it. The trees here grew differently — wider-spaced, like they were keeping their distance from something in the center. The air had a texture to it. Pressure without wind. Weight without gravity.\n\nShe stopped at a clearing he had never reached. A ring of standing stones, smaller than the outer ones he’d been visiting, and arranged not in a circle but in a spiral that coiled inward to a flat altar of black rock. The rock was not cold. He could feel it from four metres away.\n\n‘Touch it,’ she said.\n\n‘Last time someone told me to touch something unfamiliar, it was my older brother and it was a beehive.\n\nThe corner of her mouth curved upward — the first almost-smile he had seen that looked genuine. ‘I promise it won’t sting. It will, however, probably knock you flat. So plant your feet.\n\nHe planted his feet. He pressed his palm to the altar.\n\nThe world — stopped.\n\nNot ceased. Not paused. Stopped in the way a heart stops between beats, that sliver of non-time before the next pulse. The trees went silent. The air went dark. And inside that dark, Kael felt something enormous breathe.\n\nIt was not the small second heartbeat he’d been feeling at the outer stones. This was the source of it. Something vast and patient and ancient, coiled beneath the altar like a dragon sleeping under a mountain, and it recognized him with the immediate intimacy of something that had been waiting.\n\nYou came back,’ it said. Not in words. In the way a tide says something to sand.\n\nThen it showed him.\n\nImages. Or not quite images — impressions, rapid and searing: a crown made of ash and bone that burned without consuming. A throne above the clouds. A war that hadn’t started yet. A woman with silver-fire in her eyes standing beside him, one hand clasped in his, the other raised against a sky that was breaking apart.\n\nAnd one more thing. One face. His own — but older, harder, carved into something merciless by years that had not yet happened. Wearing the crown. Eyes full of a cold, terrible light.\n\nHe yanked his hand back.\n\nSeraphine was watching him with those ember eyes, arms folded, expression unreadable.\n\n‘What did you see?’ she asked.\n\nKael stared at his own palm. His hand wasn’t shaking. He made sure of that.\n\n‘Enough,’ he said.\n\nShe nodded slowly. Satisfied, though he couldn’t say why. She walked to a fallen log at the edge of the clearing and sat, all composure and folded hands, like a professor settling in to begin a lecture she’d given a hundred times.\n\n‘Then let me tell you what you are,’ she said. ‘And why every kingdom on this continent would burn you alive if they knew."},
{"t": "Dragonblood", "x": "The name she gave it was ‘Dragonblood.’\n\nNot a sigil. Not an element. Not any of the seven sanctioned affinities catalogued and controlled by the Crown’s Mages’ Guild. Something older than the guild, older than the kingdom, possibly older than the language she was using to describe it.\n\n‘The last Dragon King died four hundred years ago,’ she said, watching the altar like it might move. ‘Or that’s what the history books say. What the history books don’t say — because the Crown had them rewritten — is that he didn’t die. He was unmade. There’s a difference.\n\n‘Unmade.’ Kael turned the word over like a stone that might have something alive under it.\n\n‘Erased from the bloodline forward. The Ashen Crown — the seat of the Dragon Kings’ power — was shattered. Seven shards. Scattered across the continent into the hands of the seven noble houses that betrayed him. And all who carried his blood after were cursed not to manifest magic in the standard way.\n\nThe realization settled on Kael like cold water. ‘We’re not Ashenborn because we have nothing.\n\n‘You’re Ashenborn because you have something their system can’t categorize and doesn’t want to. Something it’s terrified of.’ Her amber eyes held his. ‘You carry the blood of Kael Mor’drath. The first and last Dragon King. And it’s waking up in you, faster than it should. Faster than I’ve ever seen it wake.\n\nHe was quiet for a long time. The altar pulsed faintly in the dark, like a second moon.\n\n‘My name,’ he said slowly. ‘Kael.\n\n‘Is not a coincidence, no.’ Something passed across her face — not quite pity, not quite awe. Something in between. ‘Your mother chose it. Deliberately.’\n\nHis mother. Who had left. Who had pressed her lips to his brow like a goodbye.\n\n‘Is she alive?’\n\nSeraphine’s pause was a fraction too long.\n\n‘That’s a question that requires more time and less open clearing,’ she said carefully. ‘For now, what matters is this: the Guild knows a Dragonblood has woken somewhere in the northern provinces. They’ve sent an Inquisitor. He’ll be in Valdremor within two weeks.’\n\n‘Then I need to leave.’\n\n‘You need to train first. You’re raw. Untouched. If that power ignites in a confrontation before you’ve shaped it, you’ll level three city blocks and hand the Guild exactly the evidence they need to justify a cleanse.’\n\nKael looked at her steadily. ‘And you’re volunteering to train me out of the goodness of your heart.\n\nThat real smile again — small, brief, like a flame that couldn’t quite decide whether to catch. ‘I have my own reasons. I won’t pretend otherwise. But my reasons and your survival are currently aligned, so.\n\n‘What are you?’ he asked. The question he’d been building toward since the moment she caught his arm. ‘You’re not from the village. You’re not Guild — your sigil is all wrong. You knew about the stones, about the Dragon King. You’ve clearly been watching me for months. What. Are. You.’\n\nShe looked at him for a long, measuring moment.\n\nThen she pushed her sleeve up to the elbow. Fully, this time.\n\nThe sigil on her inner wrist was not a shape he had any words for. It moved when he looked at it — not writhing, but shifting, the way a pattern in embers shifts when you breathe on them. It was the color of her eyes. It was, he realized with the gut-drop of genuine vertigo, breathing.\n\n‘I am the last of the Voss Witches,’ she said quietly. ‘Keepers of the Dragon Kings for six generations. Bound to find the bloodline, train them, protect them from the Guild until they’re strong enough not to need protecting.’\n\nShe rolled her sleeve back down.\n\n‘And I have been looking for you,’ she said, ‘for four years."},
{"t": "Seven Days of Fire", "x": "She gave him one night to make peace with his old life.\n\nHe spent it sitting on the roof of Hadwick’s barn, watching the village sleep, going through everything he owned in his mind. It didn’t take long. A stolen book, now memorized and falling apart. Three changes of clothes, all secondhand. A knife with a chipped blade. A single silver coin his mother had slipped into his boot before she left — he had never spent it. He’d been saving it without knowing what for.\n\nNow he knew.\n\nHe left Hadwick three coppers on the milking stool. More than he owed. Less than he felt. Then he walked into the Black Pines before the sun came up, and he didn’t look back.\n\nIf any part of him expected that to feel like surrender, it didn’t. It felt like taking the first breath after three years of holding his.\n\nSeraphine’s camp was half a day’s walk into the forest, hidden by what she called a ‘confusion ward’ — not invisibility, just a persistent wrongness that made the eye slide away. Kael walked through it and felt nothing unusual, which apparently meant something.\n\n‘Most people get a headache at the boundary,’ she said when he arrived.\n\n‘I didn’t feel anything.\n\nHer jaw tightened faintly. ‘Yes. That’s the problem with you. Your blood doesn’t recognize the concept of boundaries.\n\nThe camp was sparse: a fire that burned without wood, a leather tent, a table made from a fallen oak with three open books weighed down by stones that glowed faintly in the morning light. She had supplies enough for a month. A weapons rack with blades he didn’t recognize.\n\nShe began immediately.\n\nDay one: breathwork. He thought it would be simple. He was wrong. She had him breathe in patterns — four counts in, hold, four counts out — while she pushed against the ward around his power with her own. Every time he lost the pattern, the ward held and the warmth in his chest receded. When he held it, her eyes went slightly wide, quickly controlled.\n\nDay two: pain. Not sadistic — practical. She needed to know where his control fractured under stress. She had him hold objects charged with minor afflictions — cold that bit deeper than cold, a pressure that was not quite pain — and breathe through them without letting the inner fire respond. He failed most of the day. By nightfall he was improving.\n\nDay three: she made him angry.\n\nShe was very good at it.\n\nIt started as a sparring match, wooden practice blades. She was faster than she looked and she knew exactly how to use his weight against him, which was embarrassing given that he’d spent three years cultivating speed. She knocked him down four times. The fifth time, she said quietly — with the precision of someone selecting a blade rather than a word — ‘Your father was right to be ashamed of you.\n\nHe was on his feet and at her throat in three seconds.\n\nThe fire that erupted from his hands lit the surrounding trees in pale silver-black flame before he got it under control. Her expression never changed. She had, he noticed distantly, stepped exactly far enough backward to be out of range before he moved.\n\nShe’d known. She’d planned it.\n\nHe stood in the ring of dying flames, breathing hard, hands still smoking. Something moved across his knuckles — dark lines, not quite tattoos, flickering and fading like embers under his skin.\n\n‘That’s what it looks like from outside,’ she said.\n\nHe stared at his own hands. The lines were gone. ‘You could have warned me.\n\n‘Yes. But then you’d have been prepared, and prepared isn’t how you learn what your trigger is. Now you know.\n\nHe looked up at her.\n\nShe had a single scorch mark on her jacket sleeve, perfectly circular, the diameter of a thumb. His control had been that bad. His control had also been, at the last second, just barely good enough. Her expression told him she’d made exactly that calculation.\n\n‘You were betting I’d stop it in time,’ he said slowly. ‘What if I hadn’t?’\n\nSomething crossed her face — not fear. Something more complex. Older. ‘Then I would have been wrong about you,’ she said. ‘And we’d both have bigger problems.’\n\nHe held her gaze.\n\nShe did not look away. Neither did he.\n\nThe fire between them — and he was not thinking about the literal kind — was not something either of them named. Not yet."},
{"t": "The Weight of Old Names", "x": "On the fifth night, she told him about the shards.\n\nThey were sitting on opposite sides of the woodless fire, the darkness thick enough to feel like walls. She’d been quiet all through their evening meal — hardtack and dried venison, neither of them pretending it was anything but fuel — and then she began to speak in the low, careful way of someone who has recited a thing so many times it’s become both ritual and wound.\n\nSeven shards of the Ashen Crown. Seven noble houses.\n\nHouse Thornheart — his father’s house — held one. Of course they did.\n\nHe kept his face still when she told him that. Three years of practice made it easy.\n\n‘The shards don’t do anything by themselves,’ she continued. ‘They’re not weapons, not talismans. Alone, they’re just dark stone. But they respond to Dragonblood. In your presence, they would activate. And if all seven were brought together—’\n\n‘The Crown reforms,’ he said.\n\n‘Yes.’ She looked at the fire. ‘And whoever wears it becomes what the first Kael was. Dragon King. Lord of all unbound magic on the continent. Every sigil in every living person answers to the Crown’s bearer.’\n\nThe weight of it settled on him like armour he hadn’t consented to put on. He was quiet for a moment.\n\n‘No wonder the Guild wants me dead.’\n\n‘The Guild, the seven houses, and at least two foreign crowns who have been quietly funding the current king in exchange for assurance that no Dragon Heir would ever rise,’ she said. ‘So yes. The whole known world, basically.\n\nDespite himself, despite everything: ‘You make it sound almost manageable when you list them all like that.’\n\nA sound escaped her that was almost a laugh. Not quite. But close enough that it loosened something in the tight, careful air between them.\n\nHe asked her the question he’d been circling for five days. ‘Your family. The Voss Witches. What happened to them?’\n\nThe not-quite-laugh died.\n\n‘The Guild happened,’ she said. Short. Final. But he waited, and she knew him well enough by now to know that he would, and eventually the silence cost her more than the words. ‘My mother was the one who found the last promising candidate — a girl in the eastern provinces, seven years ago. She brought the girl to the safe house. The Guild had been watching my mother for years. They followed her.’\n\nKael said nothing.\n\n‘My mother sent me away first,’ Seraphine said, in the tone of someone who has examined every other version of the story and returned to this one because it is the only one she can carry. ‘I was fourteen. She told me to run and not look back. She told me I had the knowledge to carry the duty forward, that that was enough.\n\nShe turned her wrist over, the sigil-side down, as if by instinct.\n\n‘I’ve been running forward ever since,’ she said. ‘Looking for you.’\n\nHe looked at her across the fire for a long moment. The amber in her eyes was very still, which he was learning was when she felt the most.\n\n‘Seraphine.’\n\nShe looked at him. She always looked at him when he used her name — it startled her every time, which startled him back, because nothing else seemed to.\n\n‘I’m not going to let them win,’ he said. ‘Whatever the Crown is, whatever I am. I’m not the boy they burned things to get rid of. Not anymore.’\n\nSomething shifted in her expression. Something that wasn’t quite belief and wasn’t quite hope, but was moving steadily in that direction.\n\n‘I know,’ she said quietly. ‘That’s why I found you.’"},
{"t": "What Burns Between Them", "x": "The Inquisitor arrived in Valdremor on the ninth day.\n\nSeraphine felt it before she saw the smoke — a pressure against the confusion ward, methodical and patient, like a hand pressing on a door it expected to eventually find unlocked. She was out of her tent and at Kael’s side before the feeling fully resolved into words.\n\n‘Get up.’\n\nHe was already awake. She’d begun to accept that he rarely slept deeply — some vigilance in him had been running so long it had become structural. He’d been sitting in the dark sharpening the knife with the chipped blade, which she had offered to replace three times and which he refused each time with a look that didn’t invite elaboration.\n\n‘The Inquisitor?’\n\n‘At the village. He’ll start with records and witnesses. We have a day, maybe two before he narrows his search to the forest.’\n\nKael stood. He was taller than she usually registered — she had grown used to him at close range, where height was just height, but when he stood with that particular stillness he had, the one that had been building over nine days of training, she was reminded that he had spent three years making himself into something deliberately overlooked, and was increasingly failing to be overlooked.\n\n‘We move camp,’ she said.\n\n‘Or,’ he said.\n\nShe stopped.\n\n‘Or I let him find me.’\n\nThe silence was very precise.\n\n‘You have nine days of training,’ she said carefully. ‘Inquisitors have forty years of Guild sanctioned power. You are not ready.’\n\n‘I’m not going to fight him,’ Kael said. The stillness again. The thing she couldn’t quite name, that watched everything from somewhere behind his eyes. ‘I’m going to talk to him. Find out what he knows. What the Guild knows. You said information is the first weapon.’\n\n‘I said information is a weapon. I didn’t say to walk up to an Inquisitor and ask to borrow his.’\n\n‘Seraphine.’\n\nThere it was again. Her name in his mouth, with that particular weight he gave it, the one that made it sound like he was handing her something rather than calling to her.\n\n‘I need you to trust me,’ he said. ‘I’m not asking you to stop planning our escape. I’m asking for two hours.’\n\nShe gave him two hours.\n\nShe spent them perched in the high branches of a Black Pine with a clear sight line to the village square, a ward on her hands that would let her shatter the Inquisitor’s hold on Kael from two hundred metres away. She told herself this was protocol. She told herself the way her hands were not quite steady had nothing to do with the boy below.\n\nShe watched Kael walk into the square like he owned it.\n\nHe’d changed his jacket for the cleanest of his three secondhand ones, combed his dark hair, and adopted the particular expression she had begun privately calling his ‘performance’ face — open, slightly deferential, the careful blankness of someone with nothing to hide. She knew the teeth behind it. The Inquisitor wouldn’t.\n\nThe Inquisitor was older than she’d feared. Lean and pale and grey-robed, the Guild’s eye-and-flame stitched in silver at his collar. He was questioning the blacksmith when Kael walked up and asked, with all the earnestness of a boy who had grown up being nothing, if he could be of any help.\n\nShe couldn’t hear the exchange from this distance. She watched the body language.\n\nThe Inquisitor: suspicious initially, then relaxing into the ease of speaking to someone clearly powerless. Kael: deferential, helpfully confused, asking small questions inside the Inquisitor’s own that the man answered without noticing.\n\nTwenty minutes. Kael bowed his head respectfully and walked away.\n\nHe came back to the clearing with three things: the knowledge that the Guild had identified the general region but not the specific bloodline, a timeline of ten days before reinforcements arrived, and a name — the Guild contact in the capital who was coordinating the hunt.\n\nHe relayed all of this with the economy of someone who had been rehearsing the summary, and then looked at her with a careful expression that was not quite seeking approval but would have noticed its absence.\n\nShe stared at him for a long moment.\n\n‘You’re going to be a catastrophic problem for people who underestimate you,’ she said finally.\n\nHe almost smiled. Almost. ‘That’s the idea.’\n\nShe turned away before her face could do something she’d have to explain later. Her heartbeat, she noted with clinical irritation, was not behaving appropriately for a Witch Keeper on a professional assignment.\n\nShe filed this information and declined to examine it further.\n\nFor now."},
{"t": "The Road to Ember Hold", "x": "They broke camp the next morning.\n\nSeraphine had a destination — she’d had one all along, she simply hadn’t told him yet, which he took as information about how much she was still rationing. Ember Hold: a fortress in the Ashveil Mountains that the history books had forgotten and the Guild had never found. One of three properties her family had maintained for generations, the only one that hadn’t been burned.\n\nIt was twelve days’ travel on foot through mixed terrain. She said it like a fact. Kael received it like a fact. They were already moving by the time the village smoke appeared on the horizon behind them, and neither of them looked back.\n\nHe learned her in small pieces, the way you learn a landscape by walking through it rather than looking at a map.\n\nShe woke before dawn every morning without apparent effort and had the fire restarted and water heating before he’d fully surfaced. She carried a journal that she wrote in by firelight in a script he couldn’t read — not a cipher, she told him when he asked, but Voss-tongue, a language of four surviving speakers. She didn’t name the other three. She ate sparingly and without preference, with the focused practicality of someone who had long since stopped associating meals with pleasure.\n\nExcept for one thing.\n\nOn the second night, she produced from the bottom of her pack a small wrapped parcel that turned out to contain dried black plums and a square of dark honeycomb. She ate them with an attention entirely unlike her relationship to the hardtack, methodical and slow and with an expression that was the closest thing to unguarded he had yet seen on her face.\n\nHe asked her about it.\n\n‘My mother used to bring these back from the coastal markets,’ she said. ‘Every time. Without fail. No matter what else was scarce.’ She looked at the honey-dark square in her fingers. ‘I buy them whenever I can find them. It’s— stupid.’\n\n‘It’s not stupid,’ he said.\n\nShe looked at him.\n\n‘It’s the opposite of stupid,’ he said. ‘It’s the one thing you kept.’\n\nSomething in her face shifted, slow and deep like geological movement, the kind that reshapes coastlines but doesn’t announce itself.\n\nShe offered him a piece of the honeycomb without saying anything. He took it. He didn’t say anything either. There was a whole conversation happening in the silence, and neither of them needed to translate it.\n\nOn the fifth day, it rained.\n\nNot a gentle rain. A cold, driving, deliberate downpour that reduced visibility to twenty metres and turned the mountain path into a stream. They pressed on for two hours before Seraphine called a halt beneath a granite overhang, wet through, stripped of the easy composure the dry days allowed.\n\nShe was braiding her dripping hair off her neck when the ward on her wrist pulsed.\n\nThey both went still. The pulse came again — not the Inquisitor’s pressure, something else. Faster. More frantic.\n\n‘Tracking hound,’ she said. ‘They’ve set a resonance hound on the Dragonblood signature. It’ll find us by morning.’\n\nShe reached into her pack. Her hands moved through it quickly, purposefully, pulling out components Kael recognized from his nine days of observation as serious workings rather than ward maintenance. She began arranging them on the flat rock in a pattern that had structure — recursive, self- reinforcing.\n\n‘What do you need?’ he said.\n\nShe glanced at him. Then, apparently deciding, ‘Your hand. Left one. Keep it palm-up and don’t tighten no matter what you feel. The hound reads tension as aggression and will lock in harder.’\n\nHe extended his left hand. She placed three of her components around it in a triangle and then, with the focused, impersonal precision of a surgeon, placed her palm flat against his.\n\nThe contact was—\n\nHe was prepared for it to feel like power. He was not prepared for it to feel like recognition.\n\nHer sigil flared against her wrist, visible through her sleeve, amber- bright. The power in his chest reached toward it like a compass finding north. Her eyes met his in the dark under the overhang, rain loud all around them, close enough that he could feel the warmth of her breath through the cold. Her expression was professional. Her breathing wasn’t.\n\n‘Don’t let go,’ she said. Her voice was steady. Her pulse, where her wrist pressed near his, was not.\n\n‘I’m not going anywhere,’ he said.\n\nShe worked for twenty minutes. His hand in hers the whole time. The resonance hound’s signature faded from her ward, confused and scattered. By the time she released him, the rain had gentled and the working was complete.\n\nShe pulled her hand back. Looked at her work. Then at him.\n\n‘Your control is getting better,’ she said. Professional. Evaluative.\n\n‘Good teacher,’ he said.\n\nShe turned to repack her components. He watched her do it and thought about the way her pulse had felt under his fingers, and said nothing at all."},
{"t": "Ember Hold", "x": "They reached Ember Hold on the eleventh day.\n\nKael had been building expectations for eleven days, and still it stopped him in his tracks when it appeared from behind the last ridge.\n\nIt was not grand. It was not impressive in the way palaces were impressive. It was a fortress that had grown up from the mountain itself, black rock walls low and thick and old, narrow windows like watching eyes, towers that didn’t reach for the sky so much as resist it. Ivy had taken the southern wall. The gates were iron, gone green with centuries, and beside them, carved into the stone in script that pulsed faintly as Kael approached: the sigil of the Voss Witches.\n\nThe same breathing sigil that lived on Seraphine’s wrist.\n\nShe stopped at the gate and placed her palm against the carving. It warmed — he could see the glow through her fingers. The gate swung open on silent hinges. Kept, then. Someone or something had been maintaining this.\n\n‘How?’ he said.\n\n‘The Hold maintains itself,’ she said. ‘My great-grandmother bound a guardian into the stones. Not sentient. Just— loyal.\n\nThey walked through the gates.\n\nInside: a courtyard garden, overgrown but alive. A well that produced water when he cranked it. Three levels of interior chambers, stone-cold and dark until Seraphine moved through them lighting lanterns with a touch, and the dark pulled back to reveal bookshelves floor to ceiling, a weapons room, a working room with a long stone table, a great hall with a fireplace large enough to stand in.\n\nHis room was on the second level. Stone walls, a narrow window looking east, a bed with a mattress that should not have been as good as it was after however many years of vacancy. The shelf beside the window held three books.\n\nHe opened the first one and found his mother’s handwriting.\n\nHe sat with the book on the bed for a long time, not reading. Just holding it.\n\nShe had been here. His mother had been to Ember Hold. Had left this. On purpose, for him.\n\nHe heard a soft knock at the open door. Seraphine stood in the frame with two cups of something hot — she had found the kitchen, then, and the stores that had apparently survived as well as the mattress.\n\nShe saw the book in his hands. Read his face. Came in without asking, because she had, somewhere in eleven days, learned how to read the difference between the times he needed to be left alone and the times that looked like that but were something else.\n\nShe sat in the chair by the window and did not say anything. He opened the book.\n\nIt was instructions. Not a diary — his mother did not write the way sentimental people wrote. She wrote the way someone writes when they are very afraid of running out of time and need to be useful rather than beloved. Practical guidance for a Dragonblood awakening. The first sigil workings he would need. A map of the shards’ last known locations, dated six years ago.\n\nAnd at the very front, one paragraph in different ink. Newer. Written, he realized, in the last months before she left.\n\nKael. If you are reading this, then Seraphine found you, which means everything I did was worth it. I am not dead. I want you to know that first. I am hidden, which is not the same thing, though it has felt like it on the bad nights. I left because they were going to use you to find me and I could not allow that. I left because you are stronger than I am and this is your story now, not mine. The Hold will shelter you. Seraphine will train you. What you do next is yours to choose. Choose as the man you are, not the boy they made you feel you were.\n\nI have always known exactly what you are. I’ve been proud of it since before you were born.\n\nI’m sorry it took me this long to say it out loud.\n\nHe read it twice. Set the book down. Looked out the window at the eastern dark.\n\nSeraphine had not spoken. She was looking at the cup in her hands, giving him the privacy of her silence, which he had come to understand was one of the more valuable things she possessed.\n\n‘She’s alive,’ he said.\n\n‘Yes,’ she said. Not surprised. She had known.\n\nHe looked at her.\n\n‘I know,’ she said quietly. ‘I’m sorry. I needed to be sure you were ready to receive it. Some people— that knowledge before they’re steady enough can undo them. I needed you steady.’\n\nHe considered being angry. It would have been reasonable. Instead he found, to his own slight bewilderment, that he wasn’t.\n\n‘You were protecting the mission,’ he said.\n\n‘I was protecting you,’ she said, and it was clearly not something she had planned to say that plainly, because something in her expression shifted immediately toward correction. But she held it. Let it stand.\n\nThe fire in the east-facing window reflected in her amber eyes. In his chest the Dragonblood moved like a tide finding its level — not wild, not hungry. Something settling. Something beginning.\n\n‘Tell me where she is,’ he said.\n\nSeraphine set down her cup. Reached into her jacket. Produced a folded map.\n\n‘First,’ she said, ‘let’s talk about the shard in your father’s vault.’"},
{"t": "The Vault", "x": "'First,' she had said, 'let's talk about the shard in your father's vault.'\n\nThey talked about it for four days.\n\nHouse Thornheart's vault sat beneath the east wing of Thornheart Manor like a secret the building was ashamed of — accessible only through the wine cellar, behind a door that looked like stone wall until you pressed exactly the right place, which Kael knew because he had spent the first fourteen years of his life watching his father's steward make that particular motion every quarter moon.\n\nSome knowledge is worth more than it costs. He had been banking this one for three years.\n\nThey planned it for four days in the great hall of Ember Hold, the map his mother had left spread across the stone table with three candles holding its corners down. Seraphine argued for patience — wait a month, let the Inquisitor move on, reduce the variables. Kael argued for now.\n\n'The Inquisitor is going to widen his search radius in the next week,' he said. 'The longer we wait, the more soldiers stand between me and that vault. Right now Thornheart Manor thinks I'm a nothing they discarded. That's the best cover I will ever have.'\n\nShe looked at him across the map with her arms folded and her jaw set in the particular way that meant she was constructing a counter-argument and could not find one strong enough to use.\n\n'You're going to be insufferable when you're right all the time,' she said.\n\n'I was right about the Inquisitor,' he said. 'I was right about the ward. I was right about—'\n\n'We leave at nightfall.'\n\nShe gave him one condition: she came with him. Not as backup. As the person who would pull him out if his blood reacted to the shard before he was ready to control it. He accepted this without argument because it was sensible and because the alternative — going into his father's house alone — was the first thing in months that had made something cold move behind his ribs.\n\nHe told her none of that. She read it anyway, in the way she was developing of reading him, slow and precise and without comment.\n\nThe three-hour walk to the manor's edge was quiet. She moved through the dark forest like she was part of it — no cracked twigs, no snagged branches, the confusion ward she'd layered onto both of them sitting lightly on his skin like cool silk. He moved almost as well. Three years of pre-dawn runs through these same pines had their own knowledge to offer.\n\nThey crouched at the tree line. The manor sprawled before them, torchlit and familiar and alien all at once. He had grown up in those walls. He had been thrown out of those walls. Looking at it now from the outside, in the dark, with someone at his shoulder who believed he was worth the risk — it looked smaller than memory.\n\n'Two guards on the east wing entrance,' Seraphine murmured. 'Ward on the wine cellar door. Not Guild-standard — private commission, older school. I can unwrite it.'\n\n'My father hired a ward-writer?' Kael hadn't expected that. His father was proud, not paranoid.\n\n'After you left, apparently. He knew what you were. He wasn't sure how much of it you knew.' She paused. 'Your father is afraid of you.'\n\nKael looked at the manor for a long moment.\n\n'Good,' he said.\n\nThe guards changed at midnight. They moved during the transition — thirty seconds of double-blindness when both men had their backs to each other. Kael counted the steps to the east wing door in his memory against his legs' real strides. They matched.\n\nSeraphine's hands on the ward-lock were a revelation to watch. Not theatrical — the opposite. Methodical and quiet, her fingers reading the working the way a scholar reads a text, finding the seams, pressing there and there and there until the whole thing exhaled and released.\n\nThe door opened without sound.\n\nThe wine cellar smelled of oak and cold stone and something underneath, something that Kael's blood recognized before his mind did: a resonance, low and ancient, like a note held at the very edge of hearing. The shard. Somewhere below.\n\nHis hands began to warm.\n\n'Control,' Seraphine said quietly, very close behind him.\n\nHe breathed. Four counts. Hold. Four out. The warmth receded to a manageable pulse.\n\nThe false wall at the back of the cellar gave under his hands before he found the right stone — it simply opened, like it knew him, which he supposed it did. Dragonblood and a door built to hide something that belonged to Dragonblood. Of course it opened.\n\nSeraphine made a sound behind him. Half scientific, half something else.\n\nThe vault was not large. A single room, iron-shelved, holding the accumulated proof of three generations of Thornheart wealth: documents, sealed boxes, a sword that glowed faintly at the hilt with bonded magic. And in the center of the lowest shelf, behind no additional lock at all — as if the ward on the cellar door was the only protection his father had trusted himself to maintain — a piece of dark stone the size of a closed fist.\n\nThe shard.\n\nIt was not beautiful. It was irregular, raw-edged, matte-black, and entirely without drama. And yet when Kael looked at it every candle in the vault burned four shades brighter without anyone touching them, and the dark lines he'd seen on his knuckles weeks ago flickered across the backs of both his hands and stayed.\n\n'Don't touch it yet,' Seraphine said, and this time her voice had an edge. Not fear exactly. Respect for something large.\n\n'I know,' he said.\n\nHe crouched in front of it. Studied it. Let his blood settle into the resonance instead of lunging at it — the way she'd taught him, the first shape before the action.\n\nThe shard pulsed once, deep and slow, like a second heartbeat from outside his own chest.\n\nYou came to take back what is yours, it said. Not in words. In the tone of a tide recognizing the moon.\n\nHe picked it up."},
{"t": "Blood and Stone", "x": "The moment his hand closed around the shard, the vault went dark.\n\nNot torches-out dark. Consciousness dark — the kind that lives inside the skull. He was still standing, still breathing, Seraphine's hand slamming onto his arm and squeezing hard, grounding him in the physical world by sheer force of insistence. But the rest of him was somewhere else.\n\nHe was standing on a plain of ash under a sky split down the middle — half storm, half stars. Before him rose a throne carved from black rock and wrapped in the bones of something vast, something winged, something that had died in what looked like willing surrender rather than defeat. On the throne sat a man he recognized.\n\nHimself. Older. The version from the altar vision, the one with cold light in his eyes. But here, up close, the cold light was not cruelty. It was grief, immense and old, the kind that only kings accumulate — the weight of every choice that cost someone else more than it cost you.\n\nThe figure on the throne looked up. Met his eyes.\n\n'You're not ready for what this is,' it said. His voice. Older, lower, worn into something more deliberate.\n\n'I know,' Kael said.\n\n'You're going to do it anyway.'\n\n'Yes.'\n\nThe figure studied him for a long, strange moment. Then it smiled — not the cold smile of the vision, but something tired and fond and painfully familiar, the smile of a man seeing something he lost once and hadn't expected to find.\n\n'Good,' it said. 'She'll keep you from burning the world. Let her.'\n\nThen the ash plain dissolved.\n\nHe came back to himself on the vault floor, one knee down, Seraphine's hands on both sides of his face, her amber eyes three inches from his and blazing.\n\n'Kael.' Not a question. A command.\n\n'I'm here,' he said. His voice worked. Good.\n\nShe exhaled — one sharp, controlled breath, the exhale of someone who has been not-panicking with great disciplined effort. Her hands were still on his face. She didn't move them immediately, and he didn't mention it.\n\n'What happened?' she asked. Still close. Still that careful intensity.\n\n'Vision. The shard showed me something.' He looked at his closed fist, the stone warm inside it, settled now, no longer pulling. 'Or the blood did. I'm not sure there's a difference.'\n\n'What did it show you?'\n\nHe met her eyes. He thought about what the older version of himself had said. She'll keep you from burning the world. Let her.\n\n'That I'm on the right path,' he said. 'And that I need the other six shards.'\n\nShe searched his face in the way she did when she suspected he was telling her the truth but not all of it. He held her gaze steadily and she apparently decided to accept the partial version, for now.\n\nShe pulled her hands back. Straightened. Became professional again with the seamlessness of long practice.\n\n'Can you walk?'\n\nHe stood. The dark lines on his hands were gone. The shard sat in his palm, inert, patient. 'Yes.'\n\n'Then we need to go. Immediately.' She moved to the vault door. 'The ward release sent a resonance signature. Minor — but if the Inquisitor has a tracker stone keyed to Dragonblood within twenty miles—'\n\n'He does,' Kael said. He remembered the conversation in the village square, the careful questions he'd asked while appearing not to ask them. 'He has two.'\n\nShe looked at him. 'And you're telling me this now?'\n\n'I'm telling you this now because now is when it's relevant.'\n\nA look crossed her face that was half fury and half something that looked, improbably, like reluctant admiration. 'Insufferable,' she said.\n\n'You said that already.'\n\n'It keeps being true. Move.'\n\nThey came out of the manor's east wing at a run, through the gap in the hedge that Kael had mapped from memory, across the east pasture and into the Black Pines before the first shout went up from the manor. He didn't look back. The shard was warm in the inside pocket of his jacket, pressed against his ribs, and his blood was singing — controlled, channeled, purposeful.\n\nOne.\n\nSeraphine ran beside him, matching his pace exactly, her hand briefly catching his elbow on a dark section of path to redirect him left without breaking stride. Two people who had learned each other's rhythms without meaning to.\n\nSix more.\n\nThe trees swallowed the torch-light behind them. The cold night air tasted of pine and frost and the particular clarity of a plan in motion.\n\nAhead: Ember Hold, the books, the map, the next name on the list.\n\nKael Thornheart ran through the dark forest toward his inheritance, and for the first time in his life, the dark did not feel like a cage.\n\nIt felt like cover."},
{"t": "First Light, Last Wall", "x": "They reached Ember Hold an hour before dawn and neither of them slept.\n\nSeraphine went to the working room and began cross-referencing the shard map with texts she pulled from shelves without hesitation — she knew this library the way Kael knew the Black Pines, by feel and muscle memory and the particular intimacy of long association. He sat at the far end of the stone table and watched her work and thought about the vault vision and did not tell her what the older version of himself had said.\n\nNot yet.\n\nShe'll keep you from burning the world.\n\nHe understood, looking at her now — the focused hunch of her shoulders, the ink on her fingers, the way she mouthed words in Voss-tongue when she was thinking hard — that keeping the world from burning was not the only reason she was here. It might not even be the main one anymore. He wasn't certain when that had changed. He suspected it had been changing slowly since the first night she had sat in silence with him while he held his mother's letter, not offering comfort, not offering distance, just — present. Precisely and deliberately present.\n\nHe was not experienced with being treated like something worth staying close to. He was finding it more disorienting than any shard vision.\n\n'Second shard,' she said, without looking up. 'House Vellantir. They hold it in their seat at Ashport, which is the problem.'\n\nHe leaned forward. 'The problem being?'\n\n'Ashport is a port city. House Vellantir controls the eastern sea trade, which means they have resources, private soldiers, and a Guild liaison permanently stationed in their household.' She turned a page. 'Also the Duke of Vellantir is not an idiot. Unlike your father, he has been actively prepared for the possibility that a Dragonblood Heir would come for his shard. He has additional protections.'\n\n'What kind?'\n\nShe looked up, finally. 'A bound ward-breaker. A sorcerer sworn to the house, whose only job is to detect and counter unauthorized magical access.' She paused. 'And a granddaughter who is apparently some kind of prodigy. I've heard her name three times in Guild intelligence reports. Lady Mira Vellantir, twenty years old, elemental affinity of the storm class. She burned down an entire Guild assessment hall two years ago when they tried to conscript her.' A beat. 'I respect her, actually.'\n\nKael was quiet for a moment, thinking. 'So we can't go in the way we went into Thornheart. Too protected from the magical angle.'\n\n'Correct.'\n\n'Then we don't go in as what we are.' He felt something click, the same feeling as the village square with the Inquisitor — the pleasure of finding the right angle on a locked door. 'Ashport is a trade city. People come and go constantly. We go in as merchants. Spend time. Learn the layout. Find the shard's location through the granddaughter if possible — she clearly doesn't love the Guild either.'\n\nSeraphine looked at him steadily. Something shifted in her expression — reluctant, careful. 'That plan requires us to be in Ashport for weeks, possibly a month. At close quarters with Guild presence. And it requires you to be entirely ordinary, which you are increasingly failing to be.'\n\nHe met her eyes. 'You said I was getting better at control.'\n\n'Your control of the power, yes. Your control of the impression you make on people—' She stopped.\n\nHe waited.\n\nShe looked back at her books. 'It's not a problem,' she said, brisk again. 'It's a variable. We account for it.'\n\nHe held her eyes for a moment longer, though she wasn't looking. Then: 'We leave in three days. That gives us time to plan properly and gives the Inquisitor time to move northwest, which is the wrong direction.'\n\n'Agreed,' she said.\n\nThree days in Ember Hold.\n\nHe noted, with the precise and slightly alarmed clarity of someone cataloguing a thing they did not consent to feel, that the prospect of three more days in the same building as Seraphine Voss was not a neutral {"t": "What the Shard Does to Him", "x": "On the second night in Ember Hold, the shard woke him.\n\nNot violently. There was no vision, no pressure, no intrusion. Just warmth at his ribs where it rested in his jacket pocket beside the bed, and then wakefulness — clean and complete, as though sleep had been a task he'd finished.\n\nHe lay in the dark for a while, listening to the Hold breathe. It had a sound — faint and structural, like a living thing settling — that he had already begun to find as natural as his own heartbeat. This bothered him slightly, how quickly this had become home. He had not had a home in three years. He had apparently been more ready for one than he knew.\n\nHe took the shard out and held it in his palm in the dark.\n\nIt did not glow, exactly. But the dark around it had texture — rich and layered, like the difference between ordinary night and the night in deep forest, that particular depth that felt deliberate. He turned it over. The edges were raw but not sharp. It had the weight of something far older than the stone it was made of.\n\nHe was still looking at it when he heard Seraphine's door.\n\nShe appeared in his doorway — barefoot, in a plain dark shirt and trousers, hair loose for the first time since he'd met her. He had only ever seen it braided or pinned or tied back with the crisp efficiency of someone who did not think of their own hair as a separate consideration. Loose, it fell past her shoulders, softening the sharp clean lines of her face into something younger and more vulnerable, though her eyes were as alert as always.\n\nShe carried a candle. She stopped in the doorway.\n\n'It woke you too,' he said. Not a question.\n\nShe looked at the shard in his hand. 'The resonance bleeds when the blood is relaxed. I felt it through the ward.' She paused. 'I wasn't sure if it was pulling at you badly. I came to check.'\n\nHe looked at her in the candlelight. She looked at him.\n\nNeither of them moved for a moment.\n\n'It's not pulling badly,' he said. 'It's just awake. Like it's settling into proximity.' He looked back at it. 'Like it knows I'm keeping it.'\n\nShe crossed the threshold, which she generally did not do without purpose — she was precise about spatial distance, about the invisible architecture of closeness, in a way that told him someone had taught her that distance was safety. She came to the window and sat on the stone ledge, one knee drawn up, and looked at the shard from arm's length away.\n\n'Can I?' she asked.\n\nHe passed it to her.\n\nThe moment it touched her fingers, she made a small sound — sharp, involuntary — and her eyes went wide and very still. The shard flickered once with that ember warmth. Her sigil flared bright through her sleeve for two full seconds.\n\nThen she set it carefully on the windowsill between them and folded her hands in her lap.\n\n'Interesting,' she said. Her voice was entirely controlled. Her hands, he noted, were not quite still.\n\n'What did it do?' he asked.\n\n'It showed me the same thing it shows you.' She looked at the stone. 'The ash plain. The throne. The man.' A pause. 'Except in my version, you weren't alone on the throne. There was someone standing beside it.' Her jaw tightened fractionally. 'The shard is not subtle in its opinions.'\n\nThe silence between them was very full.\n\n'Seraphine,' he said.\n\n'Don't,' she said. Not harshly. With the precision of someone cutting a wire before it connects. 'I know what you're going to say. And it isn't—we can't—' She stopped. Restarted. 'I am your Keeper. That is a defined role with defined responsibilities and defined limits. The Voss line existed for six generations specifically to prevent the kind of entanglement that would compromise a Keeper's judgment. My grandmother wrote an entire treatise on it.'\n\n'Your grandmother didn't know me,' he said.\n\nShe looked at him sharply.\n\nHe held her gaze with the particular steadiness that was not aggression and not challenge but was the quality in him she'd identified early and never quite named — the quality of someone who had been told he was nothing for so long that being looked at hard didn't move him anymore.\n\n'I'm not saying anything,' he said. 'I'm saying your grandmother didn't know me. That's all.'\n\nShe looked at him for a long, complicated moment. The candlelight moved between them.\n\nThen she picked up the shard, crossed the room, and placed it deliberately in his hand, folding his fingers around it with both of hers.\n\nShe held on for three seconds — she counted, he was certain she counted — and then released him.\n\n'Sleep,' she said. 'We plan Ashport in the morning.'\n\nShe walked out. He listened to her door close.\n\nHe sat in the dark with the warm stone in his hand and the warmth of her hands around his still present on his skin, and stared at the ceiling of Ember Hold, and thought about what the old version of himself had said.\n\nLet her.\n\nHe would.\n\nHe was patient. He had been patient for three years. He could be patient a while longer."},
{"t": "The Inquisitor Returns", "x": "They left for Ashport on the third morning as planned.\n\nThey did not make it twenty miles.\n\nThe ambush was professional — she had to grant it that. Not the Inquisitor himself, but four of his agents, positioned at the crossroads where three paths converged and the tree cover thinned. Well-chosen ground: no shadows to use, no confusion ward possible without enough time to set it, the angles of approach covered efficiently. Someone had done their homework.\n\nSeraphine felt the ward-contact half a second before they stepped into the open. She grabbed Kael's arm and they had two seconds — she put both of them into a silence ward and a confusion layer simultaneously, hands moving fast and sure, and the agents' first strike landed on nothing.\n\nThe second strike was aimed at her.\n\nHe moved before he'd made the decision to move.\n\nThe agent came at Seraphine from the left with a binding rope charged with Guild suppression magic — the kind designed specifically for Witch-class operatives — and Kael stepped into the line of it, took the rope across his forearm, and felt the suppression surge hit his blood and bounce off.\n\nThe agent stared.\n\nKael looked at the rope against his arm. The dark lines were on his hands again, bright and steady, and the warmth in his chest had expanded into something larger, less contained, the fire wanting out.\n\nHe let a careful, controlled amount of it go.\n\nThe binding rope turned to ash. Just the rope — not the agent's hands. That was deliberate, and it cost him concentration he didn't entirely have to spare. The agent recoiled. Behind Kael, Seraphine took down the second and third agents with workings so efficient and quiet they barely registered as violence until the men were on the ground.\n\nThe fourth agent ran.\n\nKael let him.\n\nSeraphine was at his side immediately, checking the forearm where the rope had hit. Her fingers on his wrist, clinical and quick.\n\n'The suppression magic—'\n\n'Didn't work on me,' he confirmed. 'I don't think Guild suppression can touch Dragonblood. They're not compatible systems.'\n\nShe absorbed this. He could see her recalibrating, filing it, drawing new lines in the strategic map she kept running in her head.\n\n'The fourth agent will report back,' she said. 'The Inquisitor will now know two things: that the Dragonblood is active enough to combat suppression, and that they have a Witch Keeper. He'll escalate.' She looked at him. 'We cannot go to Ashport using a slow infiltration plan. We've lost that option.'\n\n'Then we go fast,' Kael said.\n\n'Fast means less intelligence. Less intelligence means more variables. More variables—'\n\n'Seraphine.' He turned to face her fully. She stopped. 'We've handled every variable so far. We handled this one.' He nodded at the two agents on the ground, unconscious and bound with their own rope. 'We go fast. We go smart. And if something goes wrong, we improvise, because we're good at that.' He paused. 'You're good at that.'\n\nShe looked at him for a moment. Then she looked away, out through the thinned trees toward the road to Ashport.\n\n'You're very good at making things sound survivable,' she said.\n\n'Practice,' he said.\n\nShe turned back. Something in her expression was different — braced and alive and not quite what she usually permitted herself. 'Alright,' she said. 'Fast.' A pause. 'I hate fast.'\n\n'I know,' he said, and started walking.\n\nShe caught up in three strides. They walked toward Ashport side by side, fast and deliberate, and the morning light came up gold through the pines ahead of them like a door that was just beginning to open."},
{"t": "Closer Than Safe", "x": "Ashport smelled of salt water, fish oil, and money.\n\nIt was the kind of city that had never been subtle about its purpose: a place where goods and information changed hands for the right price, where half the buildings had two entrances and half the conversations had two meanings, and where a pair of travelling merchants with good clothes and no guild badges could disappear into the commercial noise without any particular difficulty.\n\nSeraphine had produced the good clothes from somewhere — she produced things from somewhere regularly and he had stopped questioning the logistics — and had done something with her hair and expression that made her look like a very competent, very unremarkable trader's associate rather than the last of a bloodline that predated the kingdom. He could not entirely articulate what she had changed. It was more a quality of attention she'd turned off, like banking a fire.\n\nHe, apparently, was the problem.\n\n'You need to stop doing that,' she said, from the corner of her mouth, as they walked the harbour market.\n\n'Doing what?'\n\n'Looking at everything like you're deciding whether to conquer it.'\n\nHe blinked. 'I'm not—'\n\n'You are. You've been doing it since the shard. It's in the way you carry yourself now. Something shifted when you held it.' She didn't look at him. 'It's not bad. It's just— visible. To someone paying attention.'\n\nHe made a conscious effort to relax his shoulders. To look at the salt-fish stall like it was just a stall.\n\nSeraphine made a small sound beside him that was not quite a laugh and was absolutely a laugh. 'Better.'\n\nThe Vellantir estate occupied the northern headland above the harbour — visible from half the city, which was clearly intentional. Old money announcing itself. They gathered three days of intelligence before moving: the guard rotations, the location of the ward-breaker's rooms, the patterns of the household staff.\n\nAnd Lady Mira Vellantir.\n\nShe appeared in the harbour market on the second morning, without escort, which was either bravely independent or strategically calculated and, in Kael's assessment, probably both. Twenty years old, dark-skinned, storm-grey eyes that matched her affinity exactly, with the kind of beauty that arrived in a room and rearranged all the furniture. She was buying books — not decoratively, but with the focused, slightly predatory attention of someone who read to arm themselves.\n\nShe noticed Kael watching her before Seraphine noticed him watching.\n\nHe expected the usual: suspicion, dismissal, the social machinery of a noble girl managing an unknown. Instead, Mira Vellantir tilted her head with an expression of sharp, delighted curiosity and said, from six feet away, 'You're not from here. And you're not what you're pretending to be. Either of you.'\n\nSeraphine went very still beside him.\n\n'Perceptive,' Kael said.\n\n'Storm affinity reads ambient energy,' Mira said. 'You're producing something I've never felt before and she—' she glanced at Seraphine, and her grey eyes widened fractionally before she controlled it— 'she has a moving sigil. I've read about those. I thought they were extinct.'\n\n'Most things that aren't extinct are busy pretending to be,' Seraphine said, in her careful way.\n\nMira looked between them. Then she bought two more books, tucked them under her arm, and said, 'I take breakfast at the harbour chapel. Alone. It's unmanned at that hour and the Guild liaison doesn't know where it is yet.' A pause. 'Tomorrow. If you'd like.'\n\nShe walked away without waiting for an answer.\n\nThat night, in the single room they had taken at the harbour inn — two beds, the window sealed with a ward Seraphine refreshed every four hours — she sat at the small table reviewing the estate layouts while he cleaned the chipped knife and thought.\n\n'She's not a threat,' he said.\n\n'Agreed,' Seraphine said, without looking up. 'She's an asset or she's a complication. We'll know
