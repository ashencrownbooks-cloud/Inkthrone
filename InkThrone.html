var ICON={book:'<path d="M32 8C24 4 14 4 6 7v34c8-3 18-3 26 1 8-4 18-4 26-1V7C50 4 40 4 32 8zM32 8v34"/>',orange:'<circle cx="32" cy="24" r="17"/><path d="M32 7v34M15 24h34M20 12l24 24M44 12L20 36"/>',eye:'<path d="M4 24c8-12 48-12 56 0-8 12-48 12-56 0z"/><circle cx="32" cy="24" r="7"/>',crown:'<path d="M4 40 8 10l15 16 9-20 9 20 15-16 4 30z"/>',rose:'<circle cx="32" cy="24" r="16"/><path d="M32 8v32M16 24h32"/>',star:'<path d="M32 4l6 16 18 2-14 11 5 16-15-9-15 9 5-16L8 22l18-2z"/>'};
var BK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
var root=document.documentElement,app=document.getElementById("app"),col="#D9A441";
function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function find(s){return BOOKS.filter(function(b){return b.slug===s})[0]}
function theme(b){root.style.setProperty("--accent",b.a);root.style.setProperty("--accent2",b.b);root.style.setProperty("--glow",b.g);col=b.b}
function cover(b){return '<div class="cover'+(b.img?' has':'')+'" style="--a:'+b.a+';--b:'+b.b+(b.img?';background-image:url('+b.img+')':'')+'"><svg viewBox="0 0 64 48">'+ICON[b.icon]+'</svg><strong>'+b.title+'</strong><em>'+b.series+'</em></div>'}
function paras(t){return t.split(/\n\n/).map(function(p){return p==="§"?'<p class="sb">✶ ✶ ✶</p>':"<p>"+p+"</p>"}).join("")}
var GENRE="All";
function drawShelf(){
  var gs=["All"];BOOKS.forEach(function(b){(b.gn||[]).forEach(function(g){if(gs.indexOf(g)<0)gs.push(g)})});
  document.getElementById("gchips").innerHTML=gs.map(function(g){return '<button class="chip" data-g="'+g+'" aria-pressed="'+(g===GENRE)+'">'+g+'</button>'}).join("");
  document.getElementById("shelf").innerHTML=BOOKS.filter(function(b){return GENRE==="All"||(b.gn||[]).indexOf(GENRE)>=0}).map(function(b){return '<a class="card'+(b.status==="soon"?" soon":"")+'" href="#book-'+b.slug+'" style="--a:'+b.a+';--b:'+b.b+'">'+cover(b)+'<small>'+(b.gn||[]).slice(0,2).join(" · ")+'<br>'+(b.status==="soon"?"Coming soon":b.chapters.length+(b.chapters.length===1?" chapter":" chapters")+" so far")+'</small></a>'}).join("");
  document.querySelectorAll(".chip[data-g]").forEach(function(c){c.onclick=function(){GENRE=c.dataset.g;drawShelf()}});
  document.querySelectorAll(".card").forEach(function(c){var v=c.firstElementChild;
    c.onpointermove=function(e){var r=c.getBoundingClientRect();v.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*16+"deg");v.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*12+"deg")};
    c.onpointerleave=function(){v.style.setProperty("--ry","0deg");v.style.setProperty("--rx","0deg")}});
}
function planned(b){var g=(b.gd||[]).slice(b.chapters.length);
  if(!g.length)return b.chapters.length?"":'<p class="empty">Chapters will appear here soon.</p>';
  return '<h2>Planned chapters</h2><ul class="chapters plan">'+g.map(function(c,i){return '<li><div class="pl"><span>Chapter '+(b.chapters.length+i+1)+'</span><b>'+c[0]+'</b><em>'+c[1]+'</em></div></li>'}).join("")+'</ul>'}
function render(){
  var h=location.hash,m,b;window.scrollTo(0,0);
  if(h==="#about"){theme(BOOKS[0]);app.innerHTML='<div class="backs"><a class="back" href="#home">'+BK+'Home</a></div><article class="page"><h1>About InkThrone</h1><p>InkThrone is a home for dark fantasy romance written by Bigpanda and Small Panda.</p><p>Its first saga, The Ashen Crown, follows Kael Thornheart, born without a sigil and cast out as Ashenborn, and Seraphine Voss, the last Witch Keeper, as they gather the shards that can wake or bind a dragon-god.</p><p>New books join the shelf as they are finished. Each one gets its own colors, but reading stays simple: no sign-ups, and your place is saved on your own device.</p></article>';return}
  if(h==="#contact"){theme(BOOKS[0]);app.innerHTML='<div class="backs"><a class="back" href="#home">'+BK+'Home</a></div><article class="page"><h1>Contact</h1><p>Questions, feedback, or a typo you spotted? We’d love to hear from you.</p>'+(SITE.email?'<a class="btn" href="mailto:'+SITE.email+'">Email the authors</a>':'<p class="empty">Contact details are coming soon.</p>')+'</article>';return}
  if(h==="#privacy"){theme(BOOKS[0]);app.innerHTML='<div class="backs"><a class="back" href="#home">'+BK+'Home</a></div><article class="page"><h1>Privacy Policy</h1><p>Last updated: November 4, 2026.</p><p>InkThrone does not ask you to sign up and does not collect personal information. Your reading place and text size are saved only on your own device and are never sent to us.</p><p>If you email ashencrownbooks@gmail.com, we use your address only to reply to you.</p><p>This site is hosted on GitHub Pages, which may log basic technical data, such as your IP address, when pages are served. The site also loads fonts from Google Fonts, which may receive your IP address.</p><p>If ads are shown on this site, third-party vendors, including Google, use cookies to serve ads based on your previous visits to this and other websites. Google’s advertising cookies let it and its partners show ads based on your visits to this site and other sites. You can opt out of personalized advertising in your Google Ads Settings.</p><p>The stories on InkThrone are written for mature readers and are not directed at children.</p><p>Questions about this policy can be sent to ashencrownbooks@gmail.com.</p></article>';return}
  if(m=h.match(/^#read-(.+)-ch(\d+)$/)){b=find(m[1]);var n=+m[2];
    if(b&&b.chapters[n-1]){theme(b);put("last-"+b.slug,n);var c=b.chapters[n-1],fs=get("fs","1.125");
      app.innerHTML='<div class="tools"><span class="backs"><a class="back" href="#book-'+b.slug+'">'+BK+'Book</a><a class="back" href="#home">'+BK+'Home</a></span><span><button class="pill" data-fs="-1" aria-label="Smaller text">A−</button> <button class="pill" data-fs="1" aria-label="Larger text">A+</button></span></div><article class="reader" style="--fs:'+fs+'rem"><h1>'+c.t+'</h1>'+paras(c.x)+'</article>'+ad()+'<div class="nav">'+
      (n>1?'<a class="btn" href="#read-'+b.slug+'-ch'+(n-1)+'">Previous</a>':'<span></span>')+(n<b.chapters.length?'<a class="btn go" href="#read-'+b.slug+'-ch'+(n+1)+'">Next chapter</a>':'<a class="btn" href="#home">All books</a>')+'</div>';
      document.querySelectorAll("[data-fs]").forEach(function(x){x.onclick=function(){var v=Math.min(1.7,Math.max(.95,parseFloat(get("fs","1.125"))+(+x.dataset.fs)*.1));put("fs",v.toFixed(3));document.querySelector(".reader").style.setProperty("--fs",v+"rem")}});return}}
  if(m=h.match(/^#book-(.+)$/)){b=find(m[1]);
    if(b){theme(b);var last=+get("last-"+b.slug,0),go=b.chapters.length?'<a class="btn" href="#read-'+b.slug+'-ch'+(last||1)+'">'+(last?"Continue reading":"Start reading")+'</a>':'';
      app.innerHTML='<div class="backs"><a class="back" href="#home">'+BK+'Home</a></div><div class="bookhead"><div style="--a:'+b.a+';--b:'+b.b+'">'+cover(b)+'</div><div><h1>'+b.title+'</h1><p class="gen">'+(b.gn||[]).join(" · ")+'</p><p>'+b.desc+'</p>'+go+'</div></div>'+
      (b.chapters.length?'<h2>Chapters</h2><ul class="chapters">'+b.chapters.map(function(c,i){return '<li><a href="#read-'+b.slug+'-ch'+(i+1)+'">'+c.t+'<span>Chapter '+(i+1)+'</span></a></li>'}).join("")+'</ul>':'')+planned(b);return}}
  theme(BOOKS[0]);
  app.innerHTML='<section class="hero"><h1><span>The Ashen</span><span>Crown</span></h1><p class="lead">A dragon-blooded outcast, the last Witch Keeper, and a crown that burns everyone who reaches for it.</p><a class="btn" href="#book-'+BOOKS[0].slug+'">Start reading</a></section><h2>The shelf</h2><div class="chips" id="gchips" role="group" aria-label="Genres"></div><div class="shelf" id="shelf"></div>'+ad();
  drawShelf();
}
var mode=document.getElementById("mode");
function setMode(t){root.dataset.theme=t;mode.textContent=t==="light"?"Night mode":"Ash mode";put("mode",t)}
mode.onclick=function(){var light=root.dataset.theme==="light"||(!root.dataset.theme&&matchMedia("(prefers-color-scheme: light)").matches);setMode(light?"dark":"light")};
var sm=get("mode","");if(sm)setMode(sm);
addEventListener("hashchange",render);render();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  var cv=document.getElementById("fx"),x=cv.getContext("2d"),W,H,P=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
  for(var i=0;i<40;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,s:Math.random()*.6+.25,d:Math.random()*6.28});
  (function f(){x.clearRect(0,0,W,H);x.fillStyle=col;P.forEach(function(p){p.y-=p.s;p.d+=.01;p.x+=Math.sin(p.d)*.4;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.globalAlpha=.15+.5*(p.y/H);x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});requestAnimationFrame(f)})();
}
</script>
</body>
</html>
